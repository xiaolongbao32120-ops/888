<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หลงเปามิกซ์ Mix Margin</title>
    
    <!-- Load Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans Thai"', 'sans-serif'],
                    },
                    colors: {
                        china: {
                            red: '#a61b29',
                            darkred: '#7a1218',
                            gold: '#d4af37',
                            lightgold: '#fdf1cd',
                            cream: '#fcfaf2',
                            dark: '#2b1b1c',
                            gray: '#8c7b7c'
                        }
                    },
                    boxShadow: {
                        'glow': '0 0 15px rgba(212, 175, 55, 0.4)',
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Custom Layout for Grid to keep HTML clean */
        .item-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1.5fr 1.2fr 34px;
            gap: 6px;
            align-items: center;
        }

        /* Custom Scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #fdf1cd; 
        }
        ::-webkit-scrollbar-thumb {
            background: #d4af37; 
            border-radius: 4px;
        }

        /* Sticker Popup Animation */
        .sticker-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 100px;
            z-index: 9999;
            pointer-events: none;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
            animation: popSticker 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popSticker {
            0% {
                transform: translate(-50%, -50%) scale(0) rotate(-20deg);
                opacity: 0;
            }
            40% {
                transform: translate(-50%, -50%) scale(1.2) rotate(10deg);
                opacity: 1;
            }
            60% {
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -80%) scale(0.8);
                opacity: 0;
            }
        }

        /* Toast Animation */
        @keyframes slideInDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .toast-enter { animation: slideInDown 0.3s ease-out forwards; }
        .toast-exit { animation: fadeOut 0.3s ease-out forwards; }
    </style>
</head>

<body class="bg-gradient-to-br from-china-darkred to-china-red min-h-screen py-8 px-4 text-china-dark antialiased">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 w-full max-w-sm px-4"></div>

    <div class="max-w-[480px] mx-auto bg-china-cream p-5 sm:p-7 rounded-2xl shadow-2xl border border-china-gold/40 relative overflow-hidden">
        
        <!-- Decorative corner accents -->
        <div class="absolute top-0 left-0 w-16 h-16 border-t-4 border-l-4 border-china-gold rounded-tl-xl opacity-30 pointer-events-none"></div>
        <div class="absolute top-0 right-0 w-16 h-16 border-t-4 border-r-4 border-china-gold rounded-tr-xl opacity-30 pointer-events-none"></div>

        <!-- Header -->
        <h3 class="text-xl sm:text-2xl font-bold text-center text-china-red mb-6 flex items-center justify-center gap-2 tracking-wide">
            <span>福</span> หลงเปา Mix Margin <span> 禄</span>
        </h3>
        
        <!-- Header Row -->
        <div class="item-grid text-[11px] font-semibold text-china-red/80 mb-2 px-1 uppercase tracking-wider">
            <div>สินค้า</div>
            <div class="text-center">ชิ้น</div>
            <div>ราคา/ชิ้น</div>
            <div>GP</div>
            <div></div>
        </div>

        <!-- Item List Container -->
        <div id="item-list" class="flex flex-col gap-2 relative z-10">
            <!-- Row 1 -->
            <div class="item-grid row">
                <div class="relative flex items-center">
                    <input type="text" placeholder="สินค้า 1" class="name w-full px-2 py-2 border border-china-gold/40 rounded-lg text-xs bg-white text-china-dark focus:outline-none focus:border-china-red focus:ring-1 focus:ring-china-red transition-all" oninput="calc()">
                </div>
                <div class="relative flex items-center">
                    <input type="number" min="0" placeholder="0" class="qty w-full px-2 py-2 border border-china-gold/40 rounded-lg text-xs bg-white text-china-dark focus:outline-none focus:border-china-red focus:ring-1 focus:ring-china-red transition-all" oninput="if(this.value<0)this.value=0; calc()">
                </div>
                <div class="relative flex items-center">
                    <input type="number" min="0" placeholder="0" class="price w-full px-2 py-2 border border-china-gold/40 rounded-lg text-xs bg-white text-china-dark focus:outline-none focus:border-china-red focus:ring-1 focus:ring-china-red transition-all" oninput="if(this.value<0)this.value=0; calc()">
                </div>
                <div class="relative flex items-center">
                    <input type="number" placeholder="0" class="profit w-full pl-2 pr-5 py-2 border border-china-gold/40 rounded-lg text-xs bg-white text-china-dark focus:outline-none focus:border-china-red focus:ring-1 focus:ring-china-red transition-all" oninput="calc()">
                    <span class="absolute right-2 text-china-gray text-[10px] pointer-events-none">%</span>
                </div>
                <button class="w-[34px] h-[34px] flex items-center justify-center bg-transparent border border-china-gold/40 rounded-lg text-china-gray hover:bg-red-50 hover:text-china-red hover:border-china-red transition-all" onclick="removeRow(this)" title="ลบแถว">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4" /></svg>
                </button>
            </div>
            
            <!-- Row 2 -->
            <div class="item-grid row">
                <div class="relative flex items-center">
                    <input type="text" placeholder="สินค้า 2" class="name w-full px-2 py-2 border border-china-gold/40 rounded-lg text-xs bg-white text-china-dark focus:outline-none focus:border-china-red focus:ring-1 focus:ring-china-red transition-all" oninput="calc()">
                </div>
                <div class="relative flex items-center">
                    <input type="number" min="0" placeholder="0" class="qty w-full px-2 py-2 border border-china-gold/40 rounded-lg text-xs bg-white text-china-dark focus:outline-none focus:border-china-red focus:ring-1 focus:ring-china-red transition-all" oninput="if(this.value<0)this.value=0; calc()">
                </div>
                <div class="relative flex items-center">
                    <input type="number" min="0" placeholder="0" class="price w-full px-2 py-2 border border-china-gold/40 rounded-lg text-xs bg-white text-china-dark focus:outline-none focus:border-china-red focus:ring-1 focus:ring-china-red transition-all" oninput="if(this.value<0)this.value=0; calc()">
                </div>
                <div class="relative flex items-center">
                    <input type="number" placeholder="0" class="profit w-full pl-2 pr-5 py-2 border border-china-gold/40 rounded-lg text-xs bg-white text-china-dark focus:outline-none focus:border-china-red focus:ring-1 focus:ring-china-red transition-all" oninput="calc()">
                    <span class="absolute right-2 text-china-gray text-[10px] pointer-events-none">%</span>
                </div>
                <button class="w-[34px] h-[34px] flex items-center justify-center bg-transparent border border-china-gold/40 rounded-lg text-china-gray hover:bg-red-50 hover:text-china-red hover:border-china-red transition-all" onclick="removeRow(this)" title="ลบแถว">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4" /></svg>
                </button>
            </div>
        </div>

        <div class="mt-3 relative z-10">
            <button class="w-full sm:w-auto px-4 py-2 bg-transparent border border-china-gold text-china-red font-medium rounded-lg text-xs hover:bg-china-lightgold transition-colors flex items-center justify-center gap-1 mx-auto" onclick="addRow()">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                เพิ่มสินค้า
            </button>
        </div>

        <div class="mt-5 bg-china-lightgold/50 p-4 border border-china-gold/40 rounded-xl relative z-10">
            <label class="block text-xs font-semibold text-china-red mb-2 uppercase tracking-wide">คูปองส่วนลด</label>
            <select id="coupon-select" class="w-full px-3 py-2.5 border border-china-gold/50 rounded-lg text-sm bg-white text-china-dark focus:outline-none focus:border-china-red focus:ring-1 focus:ring-china-red cursor-pointer shadow-sm transition-all" onchange="calc()">
                <option value="0">ไม่ใช้คูปอง</option>
                <option value="25">คูปอง 1,000 ลด 25 บาท</option>
                <option value="55">คูปอง 2,000 ลด 55 บาท</option>
                <option value="150">คูปอง 5,000 ลด 150 บาท</option>
                <option value="320">คูปอง 9,000 ลด 320 บาท</option>
                <option value="800">คูปอง 20,000 ลด 800 บาท</option>
            </select>
        </div>

        <!-- Primary Action Buttons -->
        <div class="flex gap-2 mt-5 pt-5 border-t border-china-gold/30 relative z-10">
            <button class="flex-1 bg-china-lightgold text-china-dark border border-china-gold/50 py-2.5 rounded-lg text-sm font-semibold hover:bg-[#f6e19c] transition-colors" onclick="clearAll()">เคลียร์ข้อมูล</button>
            <button class="flex-1 bg-gradient-to-r from-china-darkred to-china-red text-white py-2.5 rounded-lg text-sm font-semibold shadow-glow hover:opacity-90 transition-opacity" onclick="saveHistory()">บันทึกข้อมูล</button>
        </div>

        <!-- Results Section -->
        <div class="mt-6 bg-white border-2 border-china-gold/30 rounded-xl p-5 shadow-sm relative overflow-hidden z-10">
            <!-- Decorative subtle background -->
            <div class="absolute inset-0 opacity-[0.03] bg-[radial-gradient(circle_at_center,_#a61b29_0%,_transparent_100%)] pointer-events-none"></div>

            <div class="text-center text-[11px] font-bold text-china-gray uppercase tracking-wider mb-1">กำไรเฉลี่ยสุทธิ</div>
            <div class="text-center text-4xl font-extrabold mb-3 text-china-red drop-shadow-sm" id="avg-result">0.00%</div>
            
            <div class="text-center text-[13px] text-china-gray mb-4 leading-relaxed bg-china-cream py-2 rounded-lg border border-china-gold/20">
                ยอดรวมสุทธิ: <span class="font-bold text-china-dark text-[15px]" id="net-total-result">0.00</span> บาท<br>
                กำไรสุทธิ: <span class="font-bold text-china-red text-[15px]" id="net-profit-result">0.00</span> บาท
            </div>
            
            <div class="text-[11px] font-bold uppercase tracking-wider text-china-gray mb-2 pb-1 border-b border-china-gold/30 flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                รายละเอียดกำไรแต่ละรายการ
            </div>
            <div id="breakdown-list" class="text-china-gray text-xs space-y-2">
                <div class="py-2 text-center italic opacity-70">ยังไม่มีข้อมูลยอดขาย</div>
            </div>
        </div>

        <!-- History Section -->
        <div id="history-section" class="mt-6 pt-5 border-t-2 border-dashed border-china-gold/40 relative z-10" style="display: none;">
            <div class="text-sm font-bold mb-4 text-china-red flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                ประวัติการบันทึก
            </div>
            <div id="history-list" class="space-y-3"></div>
        </div>
    </div>

    <script>
        let lastCalculation = null;

        // Custom Toast Notification System
        function showToast(message, isError = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgClass = isError ? 'bg-red-600' : 'bg-green-600';
            const icon = isError 
                ? '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>'
                : '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';

            toast.className = `toast-enter flex items-center gap-2 px-4 py-3 text-white text-sm font-medium rounded-lg shadow-lg ${bgClass}`;
            toast.innerHTML = `${icon} <span>${message}</span>`;
            
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function addRow() {
            const list = document.getElementById('item-list');
            const count = list.children.length + 1;
            const row = document.createElement('div');
            row.className = 'item-grid row opacity-0 transform -translate-y-2 transition-all duration-300';
            
            row.innerHTML = `
                <div class="relative flex items-center">
                    <input type="text" placeholder="สินค้า ${count}" class="name w-full px-2 py-2 border border-china-gold/40 rounded-lg text-xs bg-white text-china-dark focus:outline-none focus:border-china-red focus:ring-1 focus:ring-china-red transition-all" oninput="calc()">
                </div>
                <div class="relative flex items-center">
                    <input type="number" min="0" placeholder="0" class="qty w-full px-2 py-2 border border-china-gold/40 rounded-lg text-xs bg-white text-china-dark focus:outline-none focus:border-china-red focus:ring-1 focus:ring-china-red transition-all" oninput="if(this.value<0)this.value=0; calc()">
                </div>
                <div class="relative flex items-center">
                    <input type="number" min="0" placeholder="0" class="price w-full px-2 py-2 border border-china-gold/40 rounded-lg text-xs bg-white text-china-dark focus:outline-none focus:border-china-red focus:ring-1 focus:ring-china-red transition-all" oninput="if(this.value<0)this.value=0; calc()">
                </div>
                <div class="relative flex items-center">
                    <input type="number" placeholder="0" class="profit w-full pl-2 pr-5 py-2 border border-china-gold/40 rounded-lg text-xs bg-white text-china-dark focus:outline-none focus:border-china-red focus:ring-1 focus:ring-china-red transition-all" oninput="calc()">
                    <span class="absolute right-2 text-china-gray text-[10px] pointer-events-none">%</span>
                </div>
                <button class="w-[34px] h-[34px] flex items-center justify-center bg-transparent border border-china-gold/40 rounded-lg text-china-gray hover:bg-red-50 hover:text-china-red hover:border-china-red transition-all" onclick="removeRow(this)" title="ลบแถว">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4" /></svg>
                </button>
            `;
            list.appendChild(row);
            
            // Trigger animation
            requestAnimationFrame(() => {
                row.classList.remove('opacity-0', '-translate-y-2');
            });
            calc();
        }

        function removeRow(button) {
            const row = button.parentElement;
            if (document.querySelectorAll('.row').length > 1) {
                row.classList.add('opacity-0', 'scale-95');
                setTimeout(() => {
                    row.remove();
                    calc();
                }, 200);
            } else {
                showToast('ต้องมีรายการสินค้าอย่างน้อย 1 รายการครับ', true);
            }
        }

        function clearAll() {
            document.querySelectorAll('.row').forEach(row => {
                row.querySelector('.name').value = '';
                row.querySelector('.qty').value = '';
                row.querySelector('.price').value = '';
                row.querySelector('.profit').value = '';
            });
            document.getElementById('coupon-select').value = "0";
            calc();
            showToast('เคลียร์ข้อมูลเรียบร้อยแล้ว');
        }

        function calc() {
            const rows = document.querySelectorAll('.row');
            let totalVal = 0;
            let totalProfVal = 0;
            const rawItems = [];

            rows.forEach((row, i) => {
                const nameInput = row.querySelector('.name').value.trim();
                const name = nameInput || `สินค้า ${i + 1}`;
                const qty = Math.max(0, parseFloat(row.querySelector('.qty').value) || 0);
                const price = Math.max(0, parseFloat(row.querySelector('.price').value) || 0);
                const profPct = parseFloat(row.querySelector('.profit').value) || 0;

                const val = qty * price;

                if (val > 0) {
                    const profVal = val * (profPct / 100);
                    totalVal += val;
                    totalProfVal += profVal;
                    rawItems.push({ name, qty, price, val, profPct, profVal });
                }
            });

            const breakdown = rawItems.map(item => {
                const sharePct = totalVal > 0 ? (item.val / totalVal) * 100 : 0;
                return { ...item, sharePct };
            });

            const couponSelect = document.getElementById('coupon-select');
            const discountAmount = parseFloat(couponSelect.value) || 0;
            const couponText = couponSelect.options[couponSelect.selectedIndex].text;
            
            const netTotalVal = Math.max(0, totalVal - discountAmount);
            const netProfVal = totalProfVal - discountAmount;
            const avgPct = totalVal > 0 ? (netProfVal / totalVal) * 100 : 0;
            
            // Update UI elements
            const avgElement = document.getElementById('avg-result');
            avgElement.innerText = `${avgPct.toFixed(2)}%`;
            
            // Change color based on profit/loss
            if(avgPct < 0) {
                avgElement.className = "text-center text-4xl font-extrabold mb-3 text-red-600 drop-shadow-sm";
            } else {
                avgElement.className = "text-center text-4xl font-extrabold mb-3 text-china-red drop-shadow-sm";
            }

            document.getElementById('net-total-result').innerText = netTotalVal.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('net-profit-result').innerText = netProfVal.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            
            const bList = document.getElementById('breakdown-list');
            bList.innerHTML = '';
            
            if (breakdown.length === 0 && totalVal === 0) {
                bList.innerHTML = '<div class="py-2 text-center italic opacity-70">ยังไม่มีข้อมูลยอดขาย</div>';
            } else {
                breakdown.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'flex justify-between items-center text-[13px] bg-gray-50 rounded p-2 border border-gray-100';
                    div.innerHTML = `
                        <div>
                            <strong class="text-china-dark">${item.name}</strong> 
                            <span class="text-china-red font-semibold ml-1">(${item.sharePct.toFixed(1)}%)</span>
                            <div class="text-[11px] text-china-gray mt-0.5">
                                ${item.qty} ชิ้น x ${item.price.toLocaleString('th-TH')} บ. | GP ${item.profPct}%
                            </div>
                        </div>
                        <div class="text-right font-medium text-china-dark">
                            ${item.profVal.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})} บ.
                        </div>
                    `;
                    bList.appendChild(div);
                });

                if (discountAmount > 0) {
                    const discDiv = document.createElement('div');
                    discDiv.className = 'flex justify-between items-center text-[13px] mt-2 pt-2 border-t border-dashed border-red-200 text-red-600 font-medium px-2';
                    discDiv.innerHTML = `
                        <div>ส่วนลด (${couponText})</div>
                        <div>-${discountAmount.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})} บ.</div>
                    `;
                    bList.appendChild(discDiv);
                }
            }

            lastCalculation = {
                avgPct: avgPct.toFixed(2),
                totalVal,
                netTotalVal,
                totalProfVal,
                discountAmount,
                netProfVal,
                couponText,
                breakdown,
                time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })
            };
        }

        function showStickerEffect() {
            const emojis = ['🏮', '🧧','💰', '✨', '🐉', '🐲', '🤑'];
            const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];

            const sticker = document.createElement('div');
            sticker.className = 'sticker-popup';
            sticker.innerText = randomEmoji;

            document.body.appendChild(sticker);

            setTimeout(() => {
                sticker.remove();
            }, 1200);
        }

        function saveHistory() {
            if (!lastCalculation || lastCalculation.totalVal === 0) {
                showToast('กรุณากรอกข้อมูลจำนวนและราคาสินค้าก่อนบันทึกครับ', true);
                return;
            }

            const hSection = document.getElementById('history-section');
            const hList = document.getElementById('history-list');
            hSection.style.display = 'block';

            let itemsHtml = `
                <div class="grid grid-cols-[2fr_2.2fr_1.5fr] font-semibold text-[11px] text-china-red/80 mb-2 pb-1.5 border-b border-china-gold/30">
                    <div>สินค้า (สัดส่วน)</div>
                    <div class="text-right">จำนวน × ราคา = ยอดขาย</div>
                    <div class="text-right">กำไร (GP)</div>
                </div>
            `;

            lastCalculation.breakdown.forEach(item => {
                itemsHtml += `
                    <div class="grid grid-cols-[2fr_2.2fr_1.5fr] text-[11px] mb-2 pb-2 border-b border-dashed border-china-gold/20 last:border-0 last:mb-0 last:pb-0 items-center">
                        <div class="pr-1">
                            <div class="font-medium text-china-dark truncate" title="${item.name}">${item.name}</div>
                            <div class="text-china-red text-[10px] font-semibold mt-0.5">สัดส่วน ${item.sharePct.toFixed(1)}%</div>
                        </div>
                        <div class="text-right leading-tight pr-1">
                            <div class="text-china-gray text-[10px]">${item.qty} ชิ้น × ${item.price.toLocaleString('th-TH')} บ.</div>
                            <div class="font-medium text-china-dark mt-0.5">= ${item.val.toLocaleString('th-TH')}</div>
                        </div>
                        <div class="text-right leading-tight">
                            <div class="font-medium">${item.profPct}%</div>
                            <div class="text-china-gray text-[10px] mt-0.5">(${item.profVal.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})} บ.)</div>
                        </div>
                    </div>
                `;
            });

            let couponHtml = '';
            if (lastCalculation.discountAmount > 0) {
                couponHtml = `
                    <div class="flex justify-between text-[11px] text-red-600 mt-2 pt-2 border-t border-dashed border-china-gold/30">
                        <span>${lastCalculation.couponText}</span>
                        <span class="font-medium">-${lastCalculation.discountAmount.toLocaleString('th-TH')} บ.</span>
                    </div>
                `;
            }

            const card = document.createElement('div');
            // Styled like a beautiful Chinese receipt
            card.className = 'bg-[#fef9eb] p-4 rounded-xl border border-china-gold shadow-sm text-xs relative overflow-hidden transition-all hover:shadow-md';
            
            // Decorative subtle background pattern for receipt
            card.innerHTML = `
                <div class="absolute left-0 top-0 bottom-0 w-1 bg-china-gold"></div>
                <div class="flex justify-between items-center mb-3">
                    <span class="font-bold text-china-dark bg-china-gold/20 px-2 py-0.5 rounded text-[11px]">บันทึกเมื่อ: ${lastCalculation.time}</span>
                    <button class="w-6 h-6 flex items-center justify-center text-china-gray hover:text-red-500 hover:bg-red-50 rounded-md transition-colors" onclick="deleteHistory(this)" title="ลบประวัตินี้">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                </div>
                
                <div class="bg-white p-3 rounded-lg border border-china-gold/20 mb-3">
                    ${itemsHtml}
                    ${couponHtml}
                </div>

                <div class="flex justify-between items-end text-xs border-t border-dashed border-china-gold/40 pt-3">
                    <div class="text-china-dark space-y-1">
                        <div><span class="text-china-gray">ยอดรวมสุทธิ:</span> <strong class="text-sm">${lastCalculation.netTotalVal.toLocaleString('th-TH', {maximumFractionDigits: 2})}</strong> บ.</div>
                        <div><span class="text-china-gray">กำไรสุทธิ:</span> <strong class="text-sm text-china-red">${lastCalculation.netProfVal.toLocaleString('th-TH', {maximumFractionDigits: 2})}</strong> บ.</div>
                    </div>
                    <div class="text-right">
                        <div class="text-china-gray text-[10px] font-bold tracking-wide uppercase mb-0.5">กำไรเฉลี่ย</div>
                        <div class="text-xl font-extrabold text-china-red">
                            ${lastCalculation.avgPct}%
                        </div>
                    </div>
                </div>
            `;
            
            hList.prepend(card);
            showStickerEffect();
            showToast('บันทึกข้อมูลสำเร็จ!');
        }

        function deleteHistory(btn) {
            const card = btn.closest('.bg-\\[\\#fef9eb\\]');
            card.style.opacity = '0';
            card.style.transform = 'scale(0.95)';
            
            setTimeout(() => {
                card.remove();
                const hList = document.getElementById('history-list');
                if (hList.children.length === 0) {
                    document.getElementById('history-section').style.display = 'none';
                }
            }, 200);
        }

        // Initialize calculation on load just in case
        window.addEventListener('DOMContentLoaded', () => {
            calc();
        });
    </script>
</body>
</html>
